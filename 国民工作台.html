  <title>国民工作台 · 王国民律师专属AI工作台</title>
  <style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --ink:#1f2a37; --sub:#6b7785; --line:#e6eaf0;
  --primary:#1f4e79; --primary-soft:#eaf1f8; --primary2:#2f6fb0;
  --urgent:#e2483a; --warn:#e08a1e; --ok:#2f9e6b; --info:#3a7bd5;
  --shadow:0 2px 10px rgba(31,42,55,.06); --radius:12px;
  --sidebar-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",emoji,symbola,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cdd5e0;border-radius:8px}

#app{display:flex;height:100vh;overflow:hidden}

/* 侧边栏 */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#1f3a5c,#1f4e79);color:#eaf1f8;display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-item span,.sidebar.collapsed .ver,.sidebar.collapsed .ghost-btn{display:none}
.sidebar.collapsed .nav-item{justify-content:center;font-size:18px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#ffd56b,#e08a1e);color:#1f3a5c;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand-name{font-weight:700;font-size:16px;white-space:nowrap}
.brand-sub{font-size:12px;color:#a9c2dd;white-space:nowrap}
.nav{display:flex;flex-direction:column;gap:4px;padding:14px 10px;flex:1;overflow:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:#cfe0f2;font-size:14px;text-align:left;transition:.15s;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:#fff;color:var(--primary);font-weight:600}
.sidebar-foot{padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.ghost-btn{background:rgba(255,255,255,.1);color:#eaf1f8;padding:8px;border-radius:8px;font-size:13px}

.ver{font-size:11px;color:#7f9bbd;text-align:center}

/* 主区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px;flex-shrink:0}
.icon-btn{font-size:18px;color:var(--sub);padding:6px 8px;border-radius:8px}

.topbar-title{font-size:17px;font-weight:700}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.quick-memo{background:var(--primary);color:#fff;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600}
.quick-memo:hover{background:var(--primary2)}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px;min-width:48px;text-align:right}
.sync-indicator{font-size:12px;padding:5px 10px;border-radius:8px;background:#eef1f5;color:var(--sub);border:1px solid var(--line)}
.sync-indicator.on{background:#e3f5ec;color:var(--ok);border-color:#bfe6cf}
.sync-indicator:hover{background:var(--primary-soft);color:var(--primary)}
.content{flex:1;overflow:auto;padding:20px}

/* 通用卡片/栅格 */
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto;font-size:12px;font-weight:500;color:var(--sub)}
.section-title{font-size:20px;font-weight:700;margin-bottom:4px}
.section-sub{color:var(--sub);margin-bottom:18px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.spacer{flex:1}

/* 统计小卡 */
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .label{color:var(--sub);font-size:13px}
.stat .value{font-size:26px;font-weight:800;margin-top:4px;line-height:1.2}
.stat .value small{font-size:13px;font-weight:600;color:var(--sub)}
.stat .delta{font-size:12px;margin-top:4px}
.delta.up{color:var(--ok)}.delta.down{color:var(--urgent)}.delta.flat{color:var(--sub)}

/* 按钮 */
.btn{background:var(--primary);color:#fff;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px}
.btn:hover{background:var(--primary2)}
.btn.sec{background:var(--primary-soft);color:var(--primary)}
.btn.sec:hover{background:#dde9f5}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{background:#fff;border:1px solid #f3c2bd;color:var(--urgent)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none;transition:.15s}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--primary2);box-shadow:0 0 0 3px var(--primary-soft)}
textarea.input{resize:vertical;min-height:70px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.form-2{grid-template-columns:1fr}}

/* 标签/徽章 */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.7}
.badge.urgent{background:#fde6e3;color:var(--urgent)}
.badge.warn{background:#fdf0db;color:var(--warn)}
.badge.ok{background:#e3f5ec;color:var(--ok)}
.badge.info{background:#e6eefb;color:var(--info)}
.badge.gray{background:#eef1f5;color:var(--sub)}
.badge.primary{background:var(--primary-soft);color:var(--primary)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.urgent{background:var(--urgent)}.dot.warn{background:var(--warn)}.dot.ok{background:var(--ok)}.dot.info{background:var(--info)}.dot.gray{background:#c2ccd8}

/* 列表/表格 */
.list{display:flex;flex-direction:column;gap:10px}

.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-weight:600}
.list-item .li-meta{color:var(--sub);font-size:13px;margin-top:3px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
.table th{color:var(--sub);font-weight:600;background:#fafbfd}
.table tr:hover td{background:#fafbfd}
.empty{color:var(--sub);text-align:center;padding:30px 0;font-size:13px}

/* 标签页 */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 14px;color:var(--sub);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .cal-dow{text-align:center;font-size:12px;color:var(--sub);padding:6px 0;font-weight:600}

.cal .cal-cell.out{opacity:.4}
.cal .cal-num{font-weight:700;margin-bottom:4px}
.cal .cal-ev{font-size:11px;padding:2px 5px;border-radius:5px;margin-bottom:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .cal-ev.urgent{background:var(--urgent)}.cal .cal-ev.warn{background:var(--warn)}.cal .cal-ev.info{background:var(--info)}.cal .cal-ev.gray{background:#9aa7b6}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-nav .m{font-weight:700;font-size:15px}

/* 提醒列表 */
.remind-item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--info);border-radius:9px;padding:10px 12px;margin-bottom:8px}

.remind-item.warn{border-left-color:var(--warn)}

/* 报告 */
.report{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);line-height:1.8}
.report h2{font-size:18px;margin-bottom:12px;color:var(--primary)}
.report h4{margin:14px 0 6px;font-size:14px}
.report ul{margin:4px 0 4px 20px}
.report li{margin:3px 0}
.callout{background:var(--primary-soft);border-left:4px solid var(--primary);padding:10px 14px;border-radius:8px;margin:10px 0;color:#234}
.callout.warn{background:#fdf0db;border-left-color:var(--warn)}
.callout.urgent{background:#fde6e3;border-left-color:var(--urgent)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-mask[hidden]{display:none!important}
.modal{background:#fff;border-radius:14px;width:min(640px,94vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;position:sticky;top:0;background:#fff}
.modal-close{margin-left:auto;font-size:18px;color:var(--sub);padding:4px 8px;border-radius:8px}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:20px}

/* toast */
.toast-wrap{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:2000}
.toast{background:#1f2a37;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:slidein .2s;max-width:340px}
.toast.ok{background:#1f6b48}.toast.err{background:#a8322a}.toast.warn{background:#a8701a}
@keyframes slidein{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* 进度/迷你 */
.muted{color:var(--sub)}
.hr{height:1px;background:var(--line);margin:16px 0;border:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.kpi-row{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.kpi{display:flex;flex-direction:column}
.kpi b{font-size:18px}
.bar{height:8px;background:#eef1f5;border-radius:8px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:8px}
.flex{display:flex;align-items:center;gap:8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.nowrap{white-space:nowrap}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.tip{font-size:12px;color:var(--sub);background:#fafbfd;border:1px dashed var(--line);border-radius:8px;padding:8px 10px}

</style>

<body>
  <div id="app">
    <!-- 侧边导航 -->
    <aside class="sidebar" id="sidebar">

          <button class="sync-indicator" id="syncInd" title="云端同步状态">☁ 本地</button>

  <!-- 脚本（经典脚本，可直接双击打开 /workspace/index.html 使用） -->
                      
<script>
/* ===== 国民工作台 · 数据层 ===== */
window.App = window.App || {};
(function (App) {
  const KEY = 'guomin_workbench_v1';
  const COLLECTIONS = [
    'settings', 'cases', 'events', 'comms', 'knowledge',
    'live', 'liveQA', 'videos', 'competitors', 'topics', 'dms',
    'health', 'memos', 'reminderLog'
  ];

  let db = null;

  function blank() {
    const o = { _meta: { createdAt: Date.now() } };
    COLLECTIONS.forEach(c => o[c] = []);
    o.settings = [{
      account: '王国民律师', lawyer: '王国民律师',
      liveStart: '05:50', liveEnd: '08:30', morningBrief: '05:40',
      douyin: '@王国民律师', city: '同城'
    }];
    return o;
  }

  function load(force) {
    if (db && !force) return db;
    try {
      const raw = localStorage.getItem(KEY);
      db = raw ? JSON.parse(raw) : blank();
    } catch (e) { db = blank(); }
    COLLECTIONS.forEach(c => { if (!db[c]) db[c] = []; });
    if (!db.settings || !db.settings.length) db.settings = blank().settings;
    seedIfEmpty();
    return db;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); if (window.App && App.sync) App.sync.notifyWrite(); } catch (e) { console.error(e); } }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function get(col) { load(); return db[col] || []; }
  function settings() { return get('settings')[0]; }
  function add(col, obj) {
    load();
    obj.id = obj.id || uid();
    obj.createdAt = obj.createdAt || Date.now();
    db[col].push(obj);
    save(); return obj;
  }
  function update(col, id, patch) {
    load();
    const i = db[col].findIndex(x => x.id === id);
    if (i >= 0) { db[col][i] = Object.assign({}, db[col][i], patch); save(); return db[col][i]; }
    return null;
  }
  function remove(col, id) {
    load();
    db[col] = db[col].filter(x => x.id !== id);
    save();
  }
  function find(col, id) { return get(col).find(x => x.id === id); }

  function exportAll() { load(); return JSON.parse(JSON.stringify(db)); }
  function importAll(obj) {
    load();
    if (!obj || typeof obj !== 'object') throw new Error('文件格式不正确');
    COLLECTIONS.forEach(c => { if (obj[c]) db[c] = obj[c]; });
    if (obj.settings) db.settings = obj.settings;
    save();
  }

  /* 种子：法务知识库（民法典常用法条 + 文书模板） */
  function seedIfEmpty() {
    if (db.knowledge && db.knowledge.length) return;
    const seed = [
      { kind: '法条', title: '民法典·诉讼时效（第188条）', tags: '诉讼时效', body: '向人民法院请求保护民事权利的诉讼时效期间为三年。法律另有规定的，依照其规定。诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。' },
      { kind: '法条', title: '民法典·违约责任（第577条）', tags: '合同', body: '当事人一方不履行合同义务或者履行合同义务不符合约定的，应当承担继续履行、采取补救措施或者赔偿损失等违约责任。' },
      { kind: '法条', title: '民法典·离婚冷静期（第1077条）', tags: '婚姻', body: '自婚姻登记机关收到离婚登记申请之日起三十日内，任何一方不愿意离婚的，可以向婚姻登记机关撤回离婚登记申请。' },
      { kind: '法条', title: '民法典·侵权责任（第1165条）', tags: '侵权', body: '行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任。依照法律规定推定行为人有过错，其不能证明自己没有过错的，应当承担侵权责任。' },
      { kind: '法条', title: '民法典·继承（第1127条）', tags: '继承', body: '遗产按照下列顺序继承：第一顺序：配偶、子女、父母。第二顺序：兄弟姐妹、祖父母、外祖父母。' },
      { kind: '法条', title: '民法典·赠与撤销（第663条）', tags: '赠与', body: '受赠人有下列情形之一的，赠与人可以撤销赠与：（一）严重侵害赠与人或者赠与人近亲属的合法权益；（二）对赠与人有扶养义务而不履行；（三）不履行赠与合同约定的义务。' },
      { kind: '模板', title: '民事起诉状（框架）', tags: '起诉状', body: '原告：姓名、性别、出生、民族、住址、联系方式。\n被告：……\n诉讼请求：\n1. ……；2. ……；3. 本案诉讼费由被告承担。\n事实与理由：\n……（写明法律关系、争议焦点、依据）。\n此致\n××人民法院\n具状人：\n年 月 日' },
      { kind: '模板', title: '代理词（框架）', tags: '代理词', body: '尊敬的审判长、审判员：\n受××委托，本人发表如下代理意见：\n一、关于事实认定：……\n二、关于法律适用：……\n三、关于责任承担：……\n综上，请支持原告（被告）诉讼请求。\n代理人：\n年 月 日' },
      { kind: '模板', title: '证据清单（框架）', tags: '证据', body: '编号｜证据名称｜来源｜证明目的\n1 ｜……｜……｜证明……\n2 ｜……｜……｜证明……' },
      { kind: '模板', title: '法律咨询记录（话术）', tags: '咨询', body: '1. 您好，我是王国民律师，请先简要说明您遇到的情况。\n2. 关键事实确认：时间、地点、人物、金额、书面凭证。\n3. 初步法律分析 + 证据建议 + 下一步行动。\n4. 收费方式与代理方案说明。' }
    ];
    seed.forEach(s => { s.id = uid(); s.createdAt = Date.now(); db.knowledge.push(s); });
    save();
  }

  App.store = { load, save, get, settings, add, update, remove, find, uid, exportAll, importAll, COLLECTIONS };
})(window.App);

/* ===== 国民工作台 · UI 工具 ===== */
window.App = window.App || {};
(function (App) {
  const ui = {};

  /* ---------- 基础 DOM ---------- */
  ui.q = (sel, root) => (root || document).querySelector(sel);
  ui.qa = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  ui.el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  ui.esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- Toast ---------- */
  ui.toast = function (msg, type) {
    const wrap = ui.q('#toastWrap');
    const t = ui.el(`<div class="toast ${type || ''}">${ui.esc(msg)}</div>`);
    wrap.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 250); }, 2800);
  };

  /* ---------- Modal ---------- */
  ui.modal = function (opts) {
    const mask = ui.q('#modalMask'), title = ui.q('#modalTitle'), body = ui.q('#modalBody');
    title.textContent = opts.title || '提示';
    body.innerHTML = '';
    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);
    mask.hidden = false;
    const close = () => { mask.hidden = true; if (opts.onClose) opts.onClose(); };
    ui.q('#modalClose').onclick = close;
    mask.onclick = (e) => { if (e.target === mask) close(); };
    return { close, body };
  };
  ui.confirm = function (message, okText) {
    return new Promise(res => {
      const m = ui.modal({
        title: '请确认',
        body: ui.el(`<div><p style="margin-bottom:16px">${ui.esc(message)}</p>
          <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cNo">取消</button>
          <button class="btn" id="cYes">${ui.esc(okText || '确定')}</button></div></div>`)
      });
      ui.q('#cNo').onclick = () => { m.close(); res(false); };
      ui.q('#cYes').onclick = () => { m.close(); res(true); };
    });
  };

  /* ---------- 日期工具 ---------- */
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  ui.todayStr = function (d) { d = d || new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  ui.nowISO = function () { return new Date().toISOString(); };
  ui.parseLocal = function (s) { // 'YYYY-MM-DD' 或 'YYYY-MM-DDTHH:mm'
    if (!s) return new Date();
    if (s.length === 10) s += 'T09:00';
    return new Date(s.replace(' ', 'T'));
  };
  ui.fmtDate = function (s) { if (!s) return ''; const d = ui.parseLocal(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
  ui.fmtDateTime = function (iso) {
    const d = new Date(iso); if (isNaN(d)) return iso || '';
    return ui.todayStr(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  };
  ui.fmtTime = function (iso) { const d = new Date(iso); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
  ui.addDays = function (date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; };
  ui.diffDays = function (a, b) { return Math.round((ui.parseLocal(ui.todayStr(a)) - ui.parseLocal(ui.todayStr(b))) / 86400000); };
  ui.weekRange = function (ref) { // 返回本周一~周日（含 ref）
    ref = ref || new Date();
    const d = new Date(ref); const day = (d.getDay() + 6) % 7; // 周一=0
    const mon = ui.addDays(d, -day); const sun = ui.addDays(mon, 6);
    return { start: ui.todayStr(mon), end: ui.todayStr(sun), mon, sun };
  };
  ui.monthMatrix = function (year, month) { // month 0-based
    const first = new Date(year, month, 1);
    const startDow = (first.getDay() + 6) % 7; // 周一为首列
    const gridStart = ui.addDays(first, -startDow);
    const cells = [];
    for (let i = 0; i < 42; i++) cells.push(ui.addDays(gridStart, i));
    return cells;
  };

  /* ---------- 等级/徽章 ---------- */
  ui.levelBadge = function (lv) {

      : lv === 'warn' ? '<span class="badge warn">重要</span>'
        : '<span class="badge gray">普通</span>';
  };
  ui.leadText = function (m) { return m == 1440 ? '提前1天' : m == 60 ? '提前1小时' : m == 30 ? '提前30分钟' : m ? '提前' + m + '分钟' : '不提醒'; };

  /* ---------- 表单解析 ---------- */
  ui.parseForm = function (root) {
    const out = {};
    ui.qa('[data-field]', root).forEach(inp => {
      const k = inp.getAttribute('data-field');
      const v = inp.type === 'checkbox' ? inp.checked : inp.value;
      out[k] = v;
    });
    return out;
  };
  ui.formFields = function (fields) { // [{field,label,type,value,opts,ph,required}]
    return fields.map(f => {
      const id = 'f_' + f.field;
      let ctrl;
      if (f.type === 'select') {
        const os = (f.options || []).map(o => `<option value="${ui.esc(o.v != null ? o.v : o)}" ${o.v == f.value || o == f.value ? 'selected' : ''}>${ui.esc(o.t != null ? o.t : o)}</option>`).join('');
        ctrl = `<select class="input" id="${id}" data-field="${f.field}">${os}</select>`;
      } else if (f.type === 'textarea') {
        ctrl = `<textarea class="input" id="${id}" data-field="${f.field}" placeholder="${ui.esc(f.ph || '')}">${ui.esc(f.value || '')}</textarea>`;
      } else {
        ctrl = `<input class="input" id="${id}" data-field="${f.field}" type="${f.type || 'text'}" value="${ui.esc(f.value || '')}" placeholder="${ui.esc(f.ph || '')}" ${f.step ? 'step="' + f.step + '"' : ''}>`;
      }

  /* ---------- SVG 图表 ---------- */
  function svgNS(tag, attrs) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  ui.lineChart = function (container, cfg) {
    // cfg: {labels:[], series:[{name,color,data:[]}], height, yfmt}
    container.innerHTML = '';
    const W = container.clientWidth || 560, H = cfg.height || 220, padL = 42, padR = 14, padT = 14, padB = 28;
    const labels = cfg.labels, n = labels.length;
    if (!n) { container.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    let max = -Infinity, min = Infinity;
    cfg.series.forEach(s => s.data.forEach(v => { if (v != null) { max = Math.max(max, v); min = Math.min(min, v); } }));
    if (!isFinite(max)) { max = 1; min = 0; }
    if (max === min) { max += 1; min = Math.max(0, min - 1); }
    const range = max - min;
    const x = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
    const y = v => padT + (H - padT - padB) * (1 - (v - min) / range);
    const svg = svgNS('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H });
    // 网格
    for (let g = 0; g <= 4; g++) {
      const gy = padT + (H - padT - padB) * g / 4;
      const val = max - range * g / 4;
      svg.appendChild(svgNS('line', { x1: padL, y1: gy, x2: W - padR, y2: gy, stroke: '#eef1f5' }));
      const t = svgNS('text', { x: 4, y: gy + 3, fill: '#9aa7b6', 'font-size': 10 }); t.textContent = (cfg.yfmt ? cfg.yfmt(val) : Math.round(val)); svg.appendChild(t);
    }
    // x 标签（稀疏）
    const step = Math.ceil(n / 7);
    labels.forEach((lb, i) => { if (i % step === 0 || i === n - 1) { const t = svgNS('text', { x: x(i), y: H - 8, fill: '#9aa7b6', 'font-size': 10, 'text-anchor': 'middle' }); t.textContent = lb; svg.appendChild(t); } });
    // 折线
    cfg.series.forEach(s => {
      let d = '', pts = [];
      s.data.forEach((v, i) => { if (v == null) return; const px = x(i), py = y(v); pts.push([px, py]); d += (d ? ' L' : 'M') + px + ' ' + py; });
      if (d) svg.appendChild(svgNS('path', { d, fill: 'none', stroke: s.color, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }));
      pts.forEach(p => svg.appendChild(svgNS('circle', { cx: p[0], cy: p[1], r: 3, fill: '#fff', stroke: s.color, 'stroke-width': 2 })));

    if (cfg.series.length > 1) {
      const lg = document.createElement('div'); lg.className = 'wrap'; lg.style.marginTop = '6px';
      cfg.series.forEach(s => lg.innerHTML += `<span class="flex" style="font-size:12px;color:var(--sub)"><span class="dot" style="background:${s.color}"></span>${ui.esc(s.name)}</span>`);

  ui.barChart = function (container, cfg) {
    // cfg:{labels:[],data:[],color,height}
    container.innerHTML = '';
    const W = container.clientWidth || 560, H = cfg.height || 200, padL = 38, padR = 10, padT = 12, padB = 26;
    const labels = cfg.labels, n = labels.length;
    if (!n) { container.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    const max = Math.max(1, ...cfg.data);
    const bw = (W - padL - padR) / n * 0.6, gap = (W - padL - padR) / n;
    const svg = svgNS('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H });
    for (let g = 0; g <= 4; g++) { const gy = padT + (H - padT - padB) * g / 4; const val = max - max * g / 4; svg.appendChild(svgNS('line', { x1: padL, y1: gy, x2: W - padR, y2: gy, stroke: '#eef1f5' })); const t = svgNS('text', { x: 4, y: gy + 3, fill: '#9aa7b6', 'font-size': 10 }); t.textContent = Math.round(val); svg.appendChild(t); }
    labels.forEach((lb, i) => {
      const v = cfg.data[i] || 0; const bx = padL + gap * i + (gap - bw) / 2; const bh = (H - padT - padB) * v / max; const by = H - padB - bh;
      svg.appendChild(svgNS('rect', { x: bx, y: by, width: bw, height: bh, rx: 4, fill: cfg.color || '#2f6fb0' }));
      const vt = svgNS('text', { x: bx + bw / 2, y: by - 4, fill: '#6b7785', 'font-size': 10, 'text-anchor': 'middle' }); vt.textContent = (cfg.vfmt ? cfg.vfmt(v) : v); svg.appendChild(vt);
      const t = svgNS('text', { x: padL + gap * i + gap / 2, y: H - 8, fill: '#9aa7b6', 'font-size': 10, 'text-anchor': 'middle' }); t.textContent = lb; svg.appendChild(t);
    });
    container.appendChild(svg);
  };

  /* ---------- 通用导入向导（CSV/JSON 解析 + 自动映射 + 预览） ---------- */
  ui.normDate = function (v) {
    if (v == null || v === '') return '';
    let s = String(v).trim().replace(/\//g, '-');
    if (/^\d{10,13}$/.test(s)) { const n = Number(s); const d = new Date(n > 1e12 ? n : n * 1000); return isNaN(d) ? '' : ui.todayStr(d); }
    if (s.indexOf(' ') >= 0 || s.indexOf('T') >= 0) s = s.split(/[ T]/)[0];
    const m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) { const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])); return isNaN(d) ? '' : ui.todayStr(d); }
    const d = new Date(s); return isNaN(d) ? '' : ui.todayStr(d);
  };
  ui.importWizard = function (opts) {
    const fields = opts.fields; // [{key,label,kws:[]}]
    const keys = fields.map(f => f.key);
    const normHeader = h => String(h).toLowerCase().replace(/\s+/g, '');
    function autoMap(headers) {
      const assigned = {}, map = {};
      keys.forEach(k => {
        const kws = (fields.find(f => f.key === k).kws) || [];
        const hit = headers.find(h => !assigned[h] && kws.some(kw => { const n = normHeader(kw), m = normHeader(h); return m.indexOf(n) >= 0 || n.indexOf(m) >= 0; }));
        if (hit) { map[k] = hit; assigned[hit] = true; }
      });
      return map;
    }
    function parseCSV(text) {
      const rows = []; let i = 0, field = '', row = [], inQ = false;
      while (i < text.length) {
        const c = text[i];
        if (inQ) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; } else field += c; }
        else { if (c === '"') inQ = true; else if (c === ',') { row.push(field); field = ''; } else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; } else if (c !== '\r') field += c; }
        i++;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      const ne = rows.filter(r => r.some(c => c.trim() !== ''));
      if (!ne.length) return { headers: [], rows: [] };
      const headers = ne[0].map(h => h.trim());
      const data = ne.slice(1).map(r => { const o = {}; headers.forEach((h, idx) => o[h] = (r[idx] != null ? r[idx] : '').trim()); return o; });
      return { headers, rows: data };
    }
    function parseFile(content, name) {
      const t = (content || '').trim();
      if ((name && /\.json$/i.test(name)) || t[0] === '[' || t[0] === '{') {
        try {
          const j = JSON.parse(t);
          let arr = Array.isArray(j) ? j : (j.data && Array.isArray(j.data) ? j.data : null);
          if (!arr) { const maybe = Object.values(j).find(v => Array.isArray(v)); arr = maybe || [j]; }
          const headers = []; arr.slice(0, 300).forEach(o => Object.keys(o).forEach(k => { if (!headers.includes(k)) headers.push(k); }));
          const rows = arr.map(o => { const r = {}; headers.forEach(h => r[h] = o[h] != null ? String(o[h]) : ''); return r; });
          return { headers, rows };
        } catch (e) { /* 退化为 CSV */ }
      }
      return parseCSV(t);
    }
    const { headers, rows } = parseFile(opts.content, opts.name);
    if (!rows.length) { ui.toast('未解析到数据行', 'err'); return; }
    const map = autoMap(headers);
    const optsHTML = sel => `<option value="">— 忽略 —</option>` + headers.map(h => `<option value="${ui.esc(h)}" ${map[sel] === h ? 'selected' : ''}>${ui.esc(h)}</option>`).join('');
    const body = ui.el(`<div>
      <p class="muted" style="margin-bottom:10px">共解析 ${rows.length} 行、${headers.length} 列。请映射字段（已自动识别，可手动调整）：</p>
      <div class="grid grid-2">${fields.map(f => `<div class="field"><label>${ui.esc(f.label)} ${opts.requireDate && f.key === 'date' ? '<span style="color:var(--urgent)">*</span>' : ''}</label><select class="input" data-map="${f.key}">${optsHTML(f.key)}</select></div>`).join('')}</div>
      <h4 style="margin:14px 0 6px">预览（前 3 行）</h4>
      <div id="prevBox" style="max-height:210px;overflow:auto"></div>
      <div class="row mt" style="justify-content:flex-end"><button class="btn" id="doImp">确认导入 ${rows.length} 行</button></div>
    </div>`);
    const mod = ui.modal({ title: '导入数据 · 字段映射', body });
    const prev = () => {
      const m = {}; fields.forEach(f => m[f.key] = ui.q(`[data-map="${f.key}"]`, body).value);
      const lines = rows.slice(0, 3).map(r => { const o = {}; fields.forEach(f => { if (m[f.key]) o[f.key] = r[m[f.key]]; }); return o; });
      ui.q('#prevBox', body).innerHTML = '<table class="table"><thead><tr>' + fields.map(f => `<th>${ui.esc(f.label)}</th>`).join('') + '</tr></thead><tbody>' + lines.map(o => `<tr>${fields.map(f => `<td>${ui.esc(o[f.key] || '')}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
    };
    fields.forEach(f => ui.q(`[data-map="${f.key}"]`, body).onchange = prev);
    prev();
    ui.q('#doImp', body).onclick = () => {
      const m = {}; fields.forEach(f => m[f.key] = ui.q(`[data-map="${f.key}"]`, body).value);
      if (opts.requireDate && !m.date) { ui.toast('请先映射「日期」列', 'err'); return; }
      rows.forEach(r => { const rec = {}; fields.forEach(f => rec[f.key] = m[f.key] ? r[m[f.key]] : ''); opts.onRow(rec); });
      mod.close(); ui.toast(`导入完成：${rows.length} 行`, 'ok'); if (opts.after) opts.after();
    };
  };
  ui.downloadCsvTemplate = function (headers, sample, filename) {
    const csv = '﻿' + headers.join(',') + '\n' + (sample ? sample.join(',') + '\n' : '');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = filename || '导入模板.csv'; a.click();
    ui.toast('模板已下载', 'ok');
  };

  App.ui = ui;
})(window.App);

/* ===== 国民工作台 · 云端同步层（JSONBin 免费版） =====
 * 设计：本地优先（localStorage 即时响应）+ 写后异步上云 + 打开时拉取云端
 * 单人两设备同步：A 设备写入 → 上云；B 设备打开/刷新 → 拉取覆盖本地
 * 配置：在「全局辅助中心 → 云端留存」填入 JSONBin Bin ID + Access Key 即可启用
 */
window.App = window.App || {};
(function (App) {
  const SYNC = {};
  const LKEY = 'guomin_workbench_v1';          // 本地数据
  const CKEY = 'guomin_sync_config_v1';         // 云端配置（binId / masterKey / accessCode）

  SYNC.getConfig = function () {
    try { return JSON.parse(localStorage.getItem(CKEY)) || {}; } catch (e) { return {}; }
  };
  SYNC.setConfig = function (cfg) { localStorage.setItem(CKEY, JSON.stringify(cfg)); };
  SYNC.enabled = function () { const c = SYNC.getConfig(); return !!(c.binId && c.masterKey); };

  const BIN_URL = function (binId) { return 'https://api.jsonbin.io/v3/b/' + binId; };
  const HEADERS = function (cfg) {
    return { 'Content-Type': 'application/json', 'X-Master-Key': cfg.masterKey, 'X-Bin-Meta': 'false' };
  };

  // 拉取云端数据
  SYNC.pull = function () {
    const cfg = SYNC.getConfig(); if (!SYNC.enabled()) return Promise.resolve({ ok: false, reason: 'no-config' });
    return fetch(BIN_URL(cfg.binId) + '/latest', { method: 'GET', headers: HEADERS(cfg) })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(j => { const data = j.record != null ? j.record : j; return { ok: true, data }; })
      .catch(e => ({ ok: false, reason: e.message }));
  };

  // 推送本地数据到云端
  SYNC.push = function (data) {
    const cfg = SYNC.getConfig(); if (!SYNC.enabled()) return Promise.resolve({ ok: false, reason: 'no-config' });
    return fetch(BIN_URL(cfg.binId), { method: 'PUT', headers: HEADERS(cfg), body: JSON.stringify(data) })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(() => ({ ok: true }))
      .catch(e => ({ ok: false, reason: e.message }));
  };

  // 合并云端数据到本地（云端优先覆盖本地，但保留本地较新时间戳的记录）
  SYNC.mergeTo = function (cloud) {
    if (!cloud || typeof cloud !== 'object') return false;
    const local = App.store.exportAll();
    // 简化策略：以 _meta.syncedAt 比较，云端较新则整体覆盖本地
    const localT = (local._meta && local._meta.syncedAt) || 0;
    const cloudT = (cloud._meta && cloud._meta.syncedAt) || 0;
    if (cloudT > localT) {
      // 云端覆盖本地（保留本地配置）
      const savedCfg = SYNC.getConfig();
      localStorage.setItem(LKEY, JSON.stringify(cloud));
      SYNC.setConfig(savedCfg);
      return true;
    }
    return false;
  };

  // 一次完整同步：先拉取，若云端较新则覆盖本地；再把本地推上云（保证本地最新写法上云）
  SYNC.sync = function () {
    if (!SYNC.enabled()) return Promise.resolve({ ok: false, reason: 'no-config' });
    return SYNC.pull().then(res => {
      if (res.ok && res.data) { const changed = SYNC.mergeTo(res.data); if (changed) App.store.load(true); }
      // 标记同步时间并推送
      const data = App.store.exportAll();
      data._meta = data._meta || {};
      data._meta.syncedAt = Date.now();
      localStorage.setItem(LKEY, JSON.stringify(data));
      return SYNC.push(data);
    });
  };

  // 自动同步：每次本地写入后调用（节流 3 秒）
  let timer = null;
  SYNC.notifyWrite = function () {
    if (!SYNC.enabled()) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      SYNC.sync().then(r => {
        if (r.ok) App.ui.toast('☁ 已同步到云端', 'ok');
        else if (r.reason !== 'no-config') App.ui.toast('☁ 同步失败：' + r.reason, 'err');
      });
    }, 3000);
  };

  App.sync = SYNC;
})(window.App);

/* ===== 国民工作台 · 定时提醒引擎 ===== */
window.App = window.App || {};
(function (App) {
  const R = {};
  let perm = false;

  R.ensurePerm = function () {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') { try { Notification.requestPermission().then(p => perm = (p === 'granted')); } catch (e) { Notification.requestPermission(p => perm = (p === 'granted')); } }
    else perm = Notification.permission === 'granted';
  };

  function fire(title, body) {
    App.ui.toast('🔔 ' + title, 'warn');
    if (perm) { try { new Notification('国民工作台 · ' + title, { body: body || '' }); } catch (e) {} }
  }
  R.fire = fire;

  // 计算某事件的提醒触发时刻 ISO
  function remindAt(ev) {
    const base = App.ui.parseLocal(ev.datetime);
    const lead = Number(ev.lead) || 0;
    return new Date(base.getTime() - lead * 60000).toISOString();
  }

  // 今日/明日即将到来的提醒
  R.upcoming = function (days) {
    days = days || 2;
    const now = new Date();
    const list = App.store.get('events').map(ev => {
      const at = App.ui.parseLocal(ev.datetime);
      return { ev, at, remind: App.ui.parseLocal(remindAt(ev)), lead: Number(ev.lead) || 0 };
    }).filter(x => !x.ev.done && x.at >= App.ui.parseLocal(App.ui.todayStr()) )
      .sort((a, b) => a.at - b.at);
    return list;
  };

  // 检查并触发（当页面打开时运行）
  R.check = function () {
    const now = Date.now();
    const log = App.store.get('reminderLog');
    const today = App.ui.todayStr();
    App.store.get('events').forEach(ev => {
      if (ev.done || !ev.lead) return;
      const ra = remindAt(ev);
      const diff = now - new Date(ra).getTime();
      // 触发窗口：提醒时刻前0 ~ 后10分钟内
      if (diff >= -1000 && diff <= 10 * 60000) {
        const key = today + '|' + ev.id;
        if (!log.some(l => l.key === key)) {
          fire('⏰ ' + (ev.title || ev.category), (ev.client ? '当事人：' + ev.client + '\n' : '') + '时间：' + App.ui.fmtDateTime(ev.datetime) + '（' + App.ui.leadText(ev.lead) + '）');
          App.store.add('reminderLog', { key, refId: ev.id, fireAt: App.ui.nowISO() });
        }
      }
      // 诉讼时效/期限已过但未办：红色警告
      if (now > new Date(ev.datetime).getTime() && (ev.level === 'urgent')) {
        const key = 'over|' + today + '|' + ev.id;
        if (!log.some(l => l.key === key)) {
          fire('⚠ 期限已过：' + (ev.title || ev.category), '请立即处理，避免错过诉讼时效/举证期！');
          App.store.add('reminderLog', { key, refId: ev.id, fireAt: App.ui.nowISO() });
        }
      }
    });

    // 每日 9:00 自动推送同类型法律主播爆款（首页 + 弹窗）
    const d = new Date();
    if (d.getHours() === 9 && d.getMinutes() < 1) {
      const key = 'hotpush|' + today;
      if (!log.some(l => l.key === key)) {
        const dy = App.modules.douyin;

        }
      }
    }
  };

        <div class="grid grid-2">
          <div class="card"><h3>🌅 今日早安播报 <span class="tag">5:40 自动推送</span></h3><div id="briefBox"></div></div>
          <div class="card"><h3>⏰ 今日提醒 <span class="tag">${evs.filter(e => ui.todayStr(ui.parseLocal(e.datetime)) === today).length} 项</span></h3><div id="remindBox"></div></div>
        </div>
        <div class="card mt"><h3>📌 今日爆款视频推送 <span class="tag">每日 9:00 自动 · 同类型法律主播</span></h3><div id="hotBox"></div></div>
        <div class="card mt"><h3>⚡ 快捷操作</h3>
          <div class="wrap">
            <button class="btn" data-go="cases">＋ 记案件事项</button>
            <button class="btn sec" data-go="live">📺 录直播数据</button>
            <button class="btn sec" data-go="douyin">💡 生成选题</button>
            <button class="btn sec" data-go="health">🏃 健康打卡</button>
            <button class="btn ghost" id="qmHome">✍ 一句话备忘</button>
          </div>
        </div>`;
      ui.q('#briefBox', root).innerHTML = G.brief();
      const rb = ui.q('#remindBox', root);
      const todayEvs = evs.filter(e => ui.todayStr(ui.parseLocal(e.datetime)) === today);
      rb.innerHTML = todayEvs.length ? todayEvs.slice(0, 8).map(e => `<div class="remind-item ${e.level === 'urgent' ? 'urgent' : e.level === 'warn' ? 'warn' : ''}"><span class="rm-time">${ui.fmtTime(e.datetime)}</span><div><div style="font-weight:600">${ui.esc(e.title)}</div><div class="muted" style="font-size:12px">${ui.esc(e.category)} · ${ui.esc(e.client || '')} ${e.lead ? '· ' + ui.leadText(e.lead) : ''}</div></div></div>`).join('') : '<div class="empty">今日暂无提醒，状态清爽 🎉</div>';
      ui.qa('[data-go]', root).forEach(b => b.onclick = () => App.app.go(b.dataset.go));
      ui.q('#qmHome', root).onclick = () => G.quickMemo();
      // 今日爆款推送卡片
      const hb = ui.q('#hotBox', root);
      const dy = App.modules.douyin;
      const hot = dy.ensureDailyHot ? dy.ensureDailyHot(today) : [];
      hb.innerHTML = `<div class="tip" style="margin-bottom:10px">每天 9:00 自动推送 5 条同类型（法律/律师）主播爆款，点击「↗ 跳转」一键打开抖音观看。</div>` +
        (hot.length ? '<div class="list">' + hot.map(c => `<div class="list-item"><div class="li-main"><div class="li-title">${ui.esc(c.title)} <span class="badge primary">${ui.esc(c.author || '')}</span></div><div class="li-meta">🪝 ${ui.esc(c.hook || '')}</div></div><a class="btn ghost sm" href="${dy.jumpUrl(c)}" target="_blank" rel="noopener">↗ 跳转</a></div>`).join('') + '</div>' : '<div class="empty">暂无</div>');
    }
  };

  /* ===== 全局辅助中心 ===== */
  App.modules.global = {
    title: '全局辅助中心',
    render(root) {
      const m = { tab: 'brief', month: ui.todayStr().slice(0, 7), kw: '', root: null };
      m.root = root;
      function paint() {
        root.innerHTML = `<div class="section-title">🧭 全局辅助中心</div>
          <div class="section-sub">早安播报、月度总报告、快捷备忘、全局检索与云端留存，打通四大板块。</div>
          <div class="tabs">
            <button class="tab ${m.tab === 'brief' ? 'active' : ''}" data-t="brief">🌅 早安播报</button>
            <button class="tab ${m.tab === 'month' ? 'active' : ''}" data-t="month">📊 月度总报告</button>
            <button class="tab ${m.tab === 'memo' ? 'active' : ''}" data-t="memo">✍ 快捷备忘</button>
            <button class="tab ${m.tab === 'search' ? 'active' : ''}" data-t="search">🔍 全局检索</button>
            <button class="tab ${m.tab === 'cloud' ? 'active' : ''}" data-t="cloud">☁ 云端留存</button>
          </div><div id="gTab"></div>`;
        ui.qa('.tab', root).forEach(b => b.onclick = () => { m.tab = b.dataset.t; paint(); });
        const tab = ui.q('#gTab', root);
        if (m.tab === 'brief') tabBrief(tab); else if (m.tab === 'month') tabMonth(tab); else if (m.tab === 'memo') tabMemo(tab); else if (m.tab === 'search') tabSearch(tab); else if (m.tab === 'cloud') tabCloud(tab);
      }
      function tabBrief(tab) {
        tab.innerHTML = `<div class="card"><div class="row mb"><h3 style="margin:0">早安播报</h3><span class="spacer"></span><button class="btn sec sm" id="cpb">复制</button></div><div id="bb"></div>
          <div class="tip mt">系统于每日 5:40 自动生成并推送：今日待办案件 + 直播主题提醒 + 减脂注意。保持页面打开即可接收弹窗与系统通知。</div></div>`;
        ui.q('#bb', tab).innerHTML = G.brief();
        ui.q('#cpb', tab).onclick = () => { navigator.clipboard && navigator.clipboard.writeText(ui.q('#bb', tab).innerText); ui.toast('已复制', 'ok'); };
      }
      function tabMonth(tab) {
        tab.innerHTML = `<div class="card"><div class="row mb"><label class="muted">选择月份</label><input type="month" class="input" id="mm" value="${m.month}" style="max-width:180px"/>
          <span class="spacer"></span><button class="btn sec sm" id="cpm">复制报告</button></div><div id="mb"></div></div>`;
        ui.q('#mm', tab).onchange = (e) => { m.month = e.target.value; ui.q('#mb', tab).innerHTML = G.monthly(m.month); };
        ui.q('#mb', tab).innerHTML = G.monthly(m.month);
        ui.q('#cpm', tab).onclick = () => { navigator.clipboard && navigator.clipboard.writeText(ui.q('#mb', tab).innerText); ui.toast('已复制', 'ok'); };
      }
      function tabMemo(tab) {
        const list = store.get('memos').slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        tab.innerHTML = `<div class="card">
          <div class="row mb"><h3 style="margin:0">快捷备忘录 <span class="tag">${list.length} 条</span></h3><span class="spacer"></span><button class="btn sec sm" id="addM">＋ 一句话记录</button></div>
          <div id="ml"></div></div>`;
        const render = () => {
          const kw = m.kw;
          const fl = kw ? list.filter(x => x.text.includes(kw)) : list;
          ui.q('#ml', tab).innerHTML = fl.length ? '<div class="list">' + fl.map(x => `<div class="list-item"><div class="li-main"><div class="li-title">${ui.esc(x.text)}</div><div class="li-meta"><span class="badge primary">${MOD_NAME[x.module] || '备忘'}</span> ${ui.fmtDateTime(x.createdAt)}</div></div><button class="btn danger sm" data-id="${x.id}">删</button></div>`).join('') + '</div>' : '<div class="empty">暂无备忘</div>';
          ui.qa('[data-id]', ui.q('#ml', tab)).forEach(b => b.onclick = () => { store.remove('memos', b.dataset.id); render(); });
        };
        ui.q('#addM', tab).onclick = () => G.quickMemo();
        render();
      }
      function tabSearch(tab) {
        tab.innerHTML = `<div class="card"><div class="field"><label>跨全部板块检索（案件/直播/运营/健康/备忘）</label>
          <input class="input" id="sk" placeholder="输入关键词，如：工伤、离婚、直播、体重" value="${m.kw}"/></div>
          <div id="sr"></div></div>`;
        const run = () => { const r = G.search(ui.q('#sk', tab).value); ui.q('#sr', tab).innerHTML = r.length ? '<div class="list">' + r.map(x => `<div class="list-item"><div class="li-main"><div class="li-title">${ui.esc(x.title)}</div><div class="li-meta"><span class="badge primary">${ui.esc(MOD_NAME[x.mod] || x.mod)}</span> ${ui.esc(x.sub)}</div></div></div>`).join('') + '</div>' : '<div class="empty">无匹配结果</div>'; };
        ui.q('#sk', tab).oninput = (e) => { m.kw = e.target.value; run(); };
        run();
      }
      function tabCloud(tab) {
        const cfg = App.sync.getConfig();
        const enabled = App.sync.enabled();
        tab.innerHTML = `<div class="card">
          <h3>☁ 两台设备数据同步 <span class="tag ${enabled ? 'ok' : 'gray'}">${enabled ? '已启用' : '未启用'}</span></h3>
          <div class="tip mb">免费方案（JSONBin）：两台设备填同一组配置即可同步。A 设备录入后自动上云，B 设备打开/刷新自动拉取。数据仅你可见。</div>
          <form id="syncForm">
            <div class="form-2">
              <div class="field"><label>访问码（自定义，两台设备填同一个）</label><input class="input" data-field="accessCode" type="text" value="${ui.esc(cfg.accessCode || '')}" placeholder="如：wgm2026"/></div>
              <div class="field"><label>JSONBin Bin ID</label><input class="input" data-field="binId" type="text" value="${ui.esc(cfg.binId || '')}" placeholder="在 jsonbin.io 创建后获得"/></div>
            </div>
            <div class="field"><label>Master Key（访问密钥）</label><input class="input" data-field="masterKey" type="password" value="${ui.esc(cfg.masterKey || '')}" placeholder="JSONBin 个人 API Key"/></div>
            <div class="row mt"><button type="submit" class="btn">保存同步配置</button>
              <button type="button" class="btn sec" id="syncNow">立即同步</button>
              <button type="button" class="btn ghost" id="syncHelp">📋 怎么获取配置？</button>
            </div>
          </form>
          <div id="syncResult" class="mt"></div>
          <hr class="hr"/>
          <h3>💾 本地备份与恢复</h3>
          <ul>
            <li>顶栏「导出备份」可下载完整 JSON；「导入恢复」可换设备/换浏览器回填。</li>
            <li>建议每周导出一次备份，重要节点（月度报告后）再导一份。</li>
            <li>启用云同步后，本地仍保留一份，云端额外一份，双保险。</li>
          </ul>
          <div class="row"><button class="btn" id="exp">⬇ 立即导出备份</button><button class="btn ghost" id="imp">⬆ 导入恢复</button></div>
          <hr class="hr"/>
          <h3>📱 添加到手机桌面（鸿蒙 / iOS）</h3>
          <ul>
            <li><b>鸿蒙</b>：浏览器打开工作台地址 → 右下角⋯ →「添加到主屏幕」→ 桌面出现国民工作台图标。</li>
            <li><b>苹果 iOS</b>：Safari 打开地址 → 底部「分享」→「添加到主屏幕」→ 桌面出现图标。</li>
            <li>点图标直接进入工作台，像 App 一样全屏使用，无需每次输地址。</li>
          </ul>
        </div>`;
        ui.q('#syncForm', tab).onsubmit = (e) => {
          e.preventDefault(); const d = ui.parseForm(ui.q('#syncForm', tab));
          if (!d.binId || !d.masterKey) return ui.toast('请填写 Bin ID 和 Master Key', 'err');
          App.sync.setConfig(d); ui.toast('同步配置已保存', 'ok'); paint();
        };
        ui.q('#syncNow', tab).onclick = async () => {
          ui.q('#syncResult', tab).innerHTML = '<div class="tip">同步中…</div>';
          const r = await App.sync.sync();
          ui.q('#syncResult', tab).innerHTML = r.ok ? '<div class="callout">✅ 同步成功：本地与云端已一致</div>' : '<div class="callout urgent">❌ 同步失败：' + ui.esc(r.reason) + '</div>';
          if (r.ok) { App.app.go('home'); }
        };
        ui.q('#syncHelp', tab).onclick = () => showSyncHelp();
        ui.q('#exp', tab).onclick = () => App.app.exportData();
        ui.q('#imp', tab).onclick = () => App.app.importData();
      }
      function showSyncHelp() {
        const body = ui.el(`<div class="report">
          <h2>免费获取同步配置（3 分钟）</h2>
          <h4>一、注册 JSONBin</h4>
          <ol>
            <li>打开 <b>https://jsonbin.io</b> → 右上角「Sign Up」→ 免费注册（邮箱即可，无需信用卡）。</li>
            <li>登录后进入 Dashboard。</li>
          </ol>
          <h4>二、创建一个 Bin（数据容器）</h4>
          <ol>
            <li>左侧菜单「Bins」→「New Bin」。</li>
            <li>随便输入个 <code>{}</code> →「Create」。</li>
            <li>创建后会得到一串 <b>Bin ID</b>（形如 <code>3a1b2c...</code>），复制备用。</li>
          </ol>
          <h4>三、获取 Master Key</h4>
          <ol>
            <li>右上角头像 →「API Keys」。</li>
            <li>复制你的 <b>X-Master-Key</b>（形如 <code>$2a$10$...</code>）。</li>
          </ol>
          <h4>四、填入工作台</h4>
          <ol>
            <li>回到「云端留存」→ 把 Bin ID 和 Master Key 填入上方表单 → 保存。</li>
            <li>在另一台设备打开工作台，填<b>同一组</b>配置 → 点「立即同步」。</li>
            <li>之后两台设备任意一台录入，3 秒内自动上云；另一台打开时自动拉取。</li>
          </ol>
          <div class="callout warn">⚠ 数据安全：Bin ID + Master Key 相当于数据钥匙，不要泄露给他人。配置只存在你两台设备本地。</div>
          <div class="callout">💡 免费额度：JSONBin 免费版每月 10000 次请求，你每天用几十次足够；数据上限 10MB（你的全量数据通常 &lt;1MB）。</div>
        </div>`);
        ui.modal({ title: '如何免费开启两台设备同步', body });
      }
      paint();
    }
  };

  App.global = G;
})(window.App);

/* ===== 国民工作台 · 主控制器 ===== */
(function (App) {
  const ui = App.ui;
  const app = {};
  let current = 'home';

  app.go = function (mod) {
    const def = App.modules[mod]; if (!def) return;
    current = mod;
    ui.qa('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.module === mod));
    ui.q('#topbarTitle').textContent = def.title;
    const content = ui.q('#content');
    content.scrollTop = 0;
    def.render(content);
  };

  app.exportData = function () {
    const data = App.store.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '国民工作台备份_' + ui.todayStr() + '.json';
    a.click();
    ui.toast('已导出备份文件', 'ok');
  };
  app.importData = function () {
    const inp = ui.q('#importFile');
    inp.onchange = () => {
      const file = inp.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { App.store.importAll(JSON.parse(reader.result)); ui.toast('备份已恢复', 'ok'); app.go(current); }
        catch (e) { ui.toast('导入失败：' + e.message, 'err'); }
      };
      reader.readAsText(file);
      inp.value = '';
    };
    inp.click();
  };

  function startClock() {
    const el = ui.q('#clock');
    const tick = () => { const d = new Date(); el.textContent = (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); };
    tick(); setInterval(tick, 1000);
  }

  function updateSyncInd() {
    const ind = ui.q('#syncInd'); if (!ind) return;
    const on = App.sync.enabled();
    ind.textContent = on ? '☁ 已同步' : '☁ 本地';
    ind.classList.toggle('on', on);
  }
  app.updateSyncInd = updateSyncInd;

  function init() {
    App.store.load();
    ui.q('#brandAccount').textContent = App.store.settings().lawyer + ' · ' + App.store.settings().douyin;
    ui.qa('.nav-item').forEach(b => b.onclick = () => app.go(b.dataset.module));
    ui.q('#toggleSidebar').onclick = () => ui.q('#sidebar').classList.toggle('collapsed');
    ui.q('#btnQuickMemo').onclick = () => App.global.quickMemo();
    ui.q('#btnExport').onclick = () => app.exportData();
    ui.q('#btnImport').onclick = () => app.importData();
    ui.q('#syncInd').onclick = () => app.go('global');
    startClock();
    updateSyncInd();
    // 启动时拉取云端（若已配置）
    if (App.sync.enabled()) {
      App.sync.pull().then(res => {
        if (res.ok && res.data) {
          const changed = App.sync.mergeTo(res.data);
          if (changed) { App.store.load(true); ui.toast('☁ 已从云端同步最新数据', 'ok'); if (current) app.go(current); }
        }
        updateSyncInd();
      });
    }
    app.go('home');
    App.reminders.start();
  }

  App.app = app;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(window.App);

</script>
</body>
</html>
